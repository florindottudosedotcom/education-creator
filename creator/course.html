<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Course Creator - Generate multi-chapter courses using AI">
  <title>Course Creator - Emotions for Engineers</title>
  <link rel="stylesheet" href="assets/css/themes/minimal-theme.css">
  <script src="assets/js/lucide/lucide.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-btn">
        <i data-lucide="arrow-left"></i>
        Back to Creator Hub
      </a>
      <h1>
        <i data-lucide="book-open"></i>
        Course Creator
      </h1>
      <p>Select your AI provider to start creating courses</p>
    </header>

    <main>
      <div class="provider-tabs">
        <button class="tab-btn active" data-provider="openrouter">
          <i data-lucide="globe"></i>
          OpenRouter
        </button>
        <button class="tab-btn" data-provider="webllm">
          <i data-lucide="cpu"></i>
          WebLLM
        </button>
        <button class="tab-btn" data-provider="ollama">
          <i data-lucide="server"></i>
          Ollama
        </button>
        <button class="tab-btn" data-provider="puter">
          <i data-lucide="cloud"></i>
          Puter
        </button>
      </div>

      <div class="provider-content">
        <iframe id="provider-iframe" src="openrouter.html"></iframe>
      </div>
    </main>

    <footer>
      <p>&copy; 2025 Emotions for Engineers. Built with AI-powered education tools.</p>
    </footer>
  </div>

  <script type="module">
    // Initialize Lucide icons
    lucide.createIcons();

    // Provider tab switching functionality
    const tabs = document.querySelectorAll('.tab-btn');
    const iframe = document.getElementById('provider-iframe');
    const savedProvider = localStorage.getItem('selected_provider');

    // Restore saved provider selection
    if (savedProvider) {
      tabs.forEach(tab => {
        tab.classList.toggle('active', tab.dataset.provider === savedProvider);
      });
      iframe.src = `${savedProvider}.html`;
    }

    // Tab click handlers
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const provider = tab.dataset.provider;

        // Update active state
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        // Load provider page in iframe
        iframe.src = `${provider}.html`;

        // Save selection
        localStorage.setItem('selected_provider', provider);
      });
    });
  </script>
</body>
</html>
