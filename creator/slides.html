<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Slides Creator - Create AI-powered presentations">
  <title>Slides Creator - Emotions for Engineers</title>
  <link rel="stylesheet" href="assets/css/themes/minimal-theme.css">
  <script src="assets/js/lucide/lucide.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="back-btn">
        <i data-lucide="arrow-left"></i>
        Back to Creator Hub
      </a>
      <h1>
        <i data-lucide="presentation"></i>
        Slides Creator
      </h1>
      <p>Select your AI provider to start creating presentations</p>
    </header>

    <main>
      <div class="provider-tabs">
        <button class="tab-btn active" data-provider="openrouter">
          <i data-lucide="globe"></i>
          OpenRouter
        </button>
        <button class="tab-btn" data-provider="webllm">
          <i data-lucide="cpu"></i>
          WebLLM
        </button>
        <button class="tab-btn" data-provider="ollama">
          <i data-lucide="server"></i>
          Ollama
        </button>
        <button class="tab-btn" data-provider="puter">
          <i data-lucide="cloud"></i>
          Puter
        </button>
      </div>

      <div class="provider-content">
        <iframe id="provider-iframe" class="provider-frame"></iframe>
      </div>
    </main>

    <footer>
      <p>&copy; 2025 Emotions for Engineers. Built with AI-powered education tools.</p>
    </footer>
  </div>

  <script type="module">
    // Initialize Lucide icons
    lucide.createIcons();

    class SlidesPage {
      constructor() {
        this.currentProvider = 'openrouter';
        this.init();
      }

      init() {
        this.bindTabEvents();
        this.loadSavedProvider();
      }

      bindTabEvents() {
        const tabs = document.querySelectorAll('.tab-btn');

        tabs.forEach(tab => {
          tab.addEventListener('click', () => {
            const provider = tab.dataset.provider;
            this.switchProvider(provider);
          });
        });
      }

      switchProvider(provider) {
        // Update active tab
        document.querySelectorAll('.tab-btn').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.provider === provider);
        });

        // Load provider iframe
        const iframe = document.getElementById('provider-iframe');
        iframe.src = `slides/${provider}.html`;

        // Save preference
        this.currentProvider = provider;
        localStorage.setItem('selected_slides_provider', provider);
      }

      loadSavedProvider() {
        const saved = localStorage.getItem('selected_slides_provider');
        if (saved) {
          this.switchProvider(saved);
        } else {
          this.switchProvider(this.currentProvider);
        }
      }
    }

    new SlidesPage();
  </script>
</body>
</html>
